[project]
name = "hirup"
version = "0.1.0"
description = "Hirup backend: multimodal trip planning ranked by inhaled PM2.5 dose"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "httpx>=0.27",
    "numpy>=2.1",
    "pyyaml>=6.0.2",
    "pyproj==3.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

# The root project is the backend package (`services.*`). Other Python lanes
# (ml/, pipelines/) can join as workspace members with their own pyproject.toml.
[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/mobile"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["services"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["services", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the Docker stack from `make up` (OTP, OSRM)",
]
