[project]
name = "hirup-pipelines"
version = "0.1.0"
description = "Hirup data lane: ingest, QC, calibration and features for the PM2.5 model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandera[pandas]>=0.21",
    "pyyaml>=6.0.2",
    "pyproj==3.7.1",
    "rasterio==1.4.3",
    "shapely==2.1.1",
    "geopandas>=1.0",
    "scipy>=1.14",
    "osmium>=4.0",
    "pytz>=2024.1",  # duckdb needs it to return timezone-aware timestamps
]

[project.scripts]
hirup-pipelines = "hirup_pipelines.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hirup_pipelines"]
