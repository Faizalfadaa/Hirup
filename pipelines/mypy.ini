# Type-check config for the P2 lanes: `uv run mypy --config-file pipelines/mypy.ini pipelines/src ml/src`.
# Separate from the root config so P1's per-import ignores in services/ stay valid.
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
ignore_missing_imports = True
disable_error_code = import-untyped
