# Leg mode -> micro-environment key. WAIT uses wait_stop or wait_station by place type.
mode_mapping:
  WALK: walk
  BICYCLE: bicycle
  BUS: bus
  SUBWAY: rail
  RAIL: rail
  MOTORCYCLE: motorcycle
  CAR: car
  WAIT_stop: wait_stop
  WAIT_station: wait_station

