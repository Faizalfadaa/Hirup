# Hirup exposure parameters, contract v1.0 (frozen at H0).
#
# Every entry: value, range, unit, source, verified_by, note.
# - value: point value used by the Exposure Engine. For micro-environment factors F
#   it is the midpoint of the initial range in SPEC Table 12.1; that midpoint reproduces
#   the worked example in SPEC 13.2.
# - verified_by: null until a team member has checked the value against the cited
#   source. Code warns while it is null.
# - A null value means the spec gives no number. The engine must refuse to use it.
# Never fill values or citations from memory or from an AI assistant (AGENTS.md rule 3).
version: "1.0"

micro_environment:
  walk:
    f:
      value: 1.15
      range: [1.0, 1.3]
      unit: "1"
      source: "SPEC Table 12.1 (walking on sidewalk; higher on trunk/primary). Systematic review of commuter exposure by mode (2017)"
      verified_by: null
      note: "TODO(verify)"
