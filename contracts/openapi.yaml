    PlanResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        data_quality:
          $ref: '#/components/schemas/DataQuality'
          description: Worst data_quality among options
        data_freshness:
          $ref: '#/components/schemas/DataFreshness'
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
        options:
          items:
            $ref: '#/components/schemas/RouteOption'
          type: array
          maxItems: 3
          title: Options
        comparison:
          anyOf:
          - $ref: '#/components/schemas/Comparison'
          - type: 'null'
        disclaimer:
          type: string
          title: Disclaimer
      type: object
      required:
      - request_id
      - data_quality
      - data_freshness
      - sensitivity
      - options
      - comparison
      - disclaimer
      title: PlanResponse
    Pm25Quantiles:
      properties:
        p10:
          type: number
          minimum: 0.0
          title: P10
          description: PM2.5 concentration in ug/m3
        p50:
          type: number
          minimum: 0.0
          title: P50
          description: PM2.5 concentration in ug/m3
        p90:
          type: number
          minimum: 0.0
          title: P90
          description: PM2.5 concentration in ug/m3
      type: object
      required:
      - p10
      - p50
      - p90
      title: Pm25Quantiles
    RouteLabel:
      type: string
      enum:
      - fastest
      - cleanest
      - balanced
      title: RouteLabel
    RouteOption:
      properties:
        option_id:
          type: string
          title: Option Id
        labels:
          items:
            $ref: '#/components/schemas/RouteLabel'
          type: array
          minItems: 1
          title: Labels
          description: Identical options are merged into one option with labels
        depart_at:
          type: string
          format: date-time
          title: Depart At
        arrive_at:
          type: string
          format: date-time
          title: Arrive At
        duration_s:
          type: integer
          minimum: 0.0
          title: Duration S
          description: Seconds
        transfers:
          type: integer
          minimum: 0.0
          title: Transfers
        distance_m:
          type: number
          minimum: 0.0
          title: Distance M
        mean_pm25:
          type: number
          minimum: 0.0
          title: Mean Pm25
          description: Duration-weighted mean of leg mean_pm25
        dose_ug:
          type: number
          minimum: 0.0
          title: Dose Ug
          description: Inhaled PM2.5 dose in ug
        dose_ug_p10:
          type: number
          minimum: 0.0
          title: Dose Ug P10
          description: Inhaled PM2.5 dose in ug
        dose_ug_p90:
          type: number
          minimum: 0.0
          title: Dose Ug P90
          description: Inhaled PM2.5 dose in ug
        ct_ugh_m3:
          type: number
          minimum: 0.0
          title: Ct Ugh M3
          description: Concentration-time integral sum(C * F * h) in ug*h/m3
        cig_eq:
          type: number
          minimum: 0.0
          title: Cig Eq
          description: ct_ugh_m3 / 528 (cigarette equivalent)
        daily_dose_share:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Daily Dose Share
          description: Trip dose / estimated daily dose. Null while F_indoor is unverified.
        delta_vs_fastest_pct:
          type: number
          title: Delta Vs Fastest Pct
          description: Dose change vs the fastest option, percent
        delta_duration_vs_fastest_s:
          type: integer
          title: Delta Duration Vs Fastest S
        exceeds_profile_threshold:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Exceeds Profile Threshold
          description: Mean PM2.5 above the profile warning category. Null while ISPU breakpoints are
            unverified.
        co2_kg:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Co2 Kg
        cost_idr:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Cost Idr
        data_quality:
          $ref: '#/components/schemas/DataQuality'
        legs:
          items:
            $ref: '#/components/schemas/Leg'
          type: array
          minItems: 1
          title: Legs
      type: object
      required:
      - option_id
      - labels
      - depart_at
      - arrive_at
      - duration_s
      - transfers
      - distance_m
      - mean_pm25
      - dose_ug
      - dose_ug_p10
      - dose_ug_p90
      - ct_ugh_m3
      - cig_eq
      - delta_vs_fastest_pct
      - delta_duration_vs_fastest_s
      - data_quality
      - legs
      title: RouteOption
    RouteProfile:
      properties:
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
          default: umum
        max_walk_m:
          type: integer
          maximum: 3000.0
          minimum: 100.0
          title: Max Walk M
          default: 1000
        avoid_transfers:
          type: boolean
          title: Avoid Transfers
          description: Priority S (FR-07)
          default: false
        excluded_modes:
          items:
            $ref: '#/components/schemas/LegMode'
          type: array
          title: Excluded Modes
          description: Priority S (FR-07)
      additionalProperties: false
      type: object
      title: RouteProfile
    Sensitivity:
      type: string
      enum:
      - umum
      - rentan
      title: Sensitivity
      description: Profile from SPEC 12.4. Changes alpha, cleanest tolerance and warning threshold.
    TransitRoute:
      properties:
        id:
          type: string
          title: Id
        short_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Short Name
        long_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Long Name
        agency:
          anyOf:
          - type: string
          - type: 'null'
          title: Agency
      type: object
      required:
      - id
      title: TransitRoute
    WaitPlace:
      type: string
      enum:
      - stop
      - station
      title: WaitPlace
    Problem:
      properties:
        type:
          $ref: '#/components/schemas/ProblemType'
        title:
          title: Title
          type: string
        status:
          maximum: 599
          minimum: 400
          title: Status
          type: integer
        detail:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Detail
        instance:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Instance
        request_id:
          title: Request Id
          type: string
      required:
      - type
      - title
      - status
      - request_id
      title: Problem
      type: object
    ProblemType:
      enum:
      - validation_error
      - not_found
      - out_of_service_area
      - rate_limited
      - data_unavailable
      - not_implemented
      - internal_error
      title: ProblemType
      type: string
servers:
- url: http://localhost:8000
  description: local API (make api)
- url: http://localhost:4010
  description: mock (make mock)
