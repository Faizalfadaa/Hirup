      type: object
      required:
      - duration_s
      - distance_m
      - mean_pm25
      - dose_ug
      - dose_ug_p10
      - dose_ug_p90
      - ct_ugh_m3
      - cig_eq
      - polyline
      - data_quality
      title: ComparisonOption
    Confidence:
      type: string
      enum:
