      tags:
      - air quality
      summary: Daily mean PM2.5 and cigarette equivalent for the day
      operationId: daily_summary_v1_aq_daily_summary_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          title: Lat
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          title: Lon
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Defaults to today (WIB)
          title: Date
        description: Defaults to today (WIB)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySummaryResponse'
              example:
                lat: -6.2088
                lon: 106.8227
                date: '2026-10-16'
                mean_pm25: 50.0
                cig_eq_day: 2.27
                data_quality: synthetic
          headers:
            X-Data-Age-Seconds:
              description: Age of the PM2.5 raster behind this response
              schema:
                type: integer
                minimum: 0
        '400':
          description: Permintaan tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: validation_error
                title: Permintaan tidak valid
                status: 400
                detail: 'origin.lat: Input should be greater than or equal to -90'
                request_id: rq_9f2c4e1a
        '404':
          description: Di luar area layanan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: out_of_service_area
                title: Di luar area layanan
                status: 404
                detail: Asal atau tujuan berada di luar area pilot Hirup.
                request_id: rq_9f2c4e1a
        '503':
