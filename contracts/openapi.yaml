components:
  schemas:
    AqForecastResponse:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          examples:
          - -6.2088
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          examples:
          - 106.8227
        source:
          $ref: '#/components/schemas/ForecastSource'
        hours:
          items:
            $ref: '#/components/schemas/ForecastHour'
          type: array
          maxItems: 24
          title: Hours
        data_quality:
          $ref: '#/components/schemas/DataQuality'
      type: object
      required:
      - lat
      - lon
      - source
      - hours
      - data_quality
      title: AqForecastResponse
    AqPointResponse:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          examples:
          - -6.2088
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          examples:
          - 106.8227
        cell_id:
          type: string
          title: Cell Id
          description: 100 m grid cell (EPSG:32748)
        valid_hour:
          type: string
          format: date-time
          title: Valid Hour
        pm25:
          $ref: '#/components/schemas/Pm25Quantiles'
        ispu_category:
          anyOf:
          - $ref: '#/components/schemas/IspuCategory'
          - type: 'null'
          description: Category of pm25.p50. Null while ISPU breakpoints are unverified.
        data_quality:
          $ref: '#/components/schemas/DataQuality'
      type: object
      required:
      - lat
      - lon
      - cell_id
      - valid_hour
      - pm25
      - ispu_category
      - data_quality
      title: AqPointResponse
    Assumption:
      properties:
