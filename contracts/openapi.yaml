        dose_ug:
          type: number
          minimum: 0.0
          title: Dose Ug
          description: Inhaled PM2.5 dose in ug
        dose_ug_p10:
          type: number
          minimum: 0.0
          title: Dose Ug P10
          description: Inhaled PM2.5 dose in ug
        dose_ug_p90:
          type: number
          minimum: 0.0
          title: Dose Ug P90
          description: Inhaled PM2.5 dose in ug
        ct_ugh_m3:
          type: number
          minimum: 0.0
          title: Ct Ugh M3
