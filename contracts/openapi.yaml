        car:
          anyOf:
          - $ref: '#/components/schemas/ComparisonOption'
          - type: 'null'
      type: object
      required:
      - motorcycle
      - car
      title: Comparison
    ComparisonOption:
      properties:
        duration_s:
          type: integer
          minimum: 0.0
