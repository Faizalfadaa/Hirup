name: hirup-routing

services:
  otp:
    image: ${OTP_IMAGE:?set OTP_IMAGE from infra/images.env}
    command: ["--load", "--serve"]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx8g
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${OTP_HOST_PORT:-18080}:8080"
    volumes:
      - ../data/otp:/var/opentripplanner:ro
      - ./scripts/health.sh:/health.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/bash", "/health.sh", "otp"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s

  osrm-car:
    image: ${OSRM_IMAGE:?set OSRM_IMAGE from infra/images.env}
    command: ["osrm-routed", "--algorithm", "MLD", "--verbosity", "WARNING", "--max-alternatives", "3", "/data/pilot.osrm"]
    ports:
      - "127.0.0.1:${OSRM_CAR_HOST_PORT:-5000}:5000"
    volumes:
      - ../data/osrm/car:/data:ro
      - ./scripts/health.sh:/health.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/bash", "/health.sh", "osrm"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  osrm-moto:
    image: ${OSRM_IMAGE:?set OSRM_IMAGE from infra/images.env}
    command: ["osrm-routed", "--algorithm", "MLD", "--verbosity", "WARNING", "--max-alternatives", "3", "/data/pilot.osrm"]
    ports:
      - "127.0.0.1:${OSRM_MOTO_HOST_PORT:-5001}:5000"
    volumes:
      - ../data/osrm/motorcycle:/data:ro
      - ./scripts/health.sh:/health.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/bash", "/health.sh", "osrm"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    # Temporary readiness service; replace with the T0/T5 API image after merge.
    image: ${PYTHON_IMAGE:?set PYTHON_IMAGE from infra/images.env}
    command: ["python", "/workspace/infra/scripts/placeholder_api.py"]
    environment:
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ..:/workspace:ro
    restart: unless-stopped
    depends_on:
      otp:
        condition: service_healthy
      osrm-car:
        condition: service_healthy
      osrm-moto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
