[project]
name = "hirup-routing-infra"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pyproj==3.7.1"]

[dependency-groups]
dev = ["mypy==1.15.0", "pytest==8.3.5", "ruff==0.11.13"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "pyproj.*"
ignore_missing_imports = true
