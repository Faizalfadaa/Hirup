# Test-only stack. The routing project must be created by infra/ci/stack.sh.
services:
  caddy:
    image: ${CADDY_IMAGE:?set pinned Caddy image}
    environment: {HIRUP_DOMAIN: localhost}
    ports: ["127.0.0.1:8443:443", "127.0.0.1:18082:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    networks: [public, edge]
    depends_on:
      gateway: {condition: service_healthy}
  gateway:
    image: ${NGINX_IMAGE:?set pinned Nginx image}
    entrypoint: []
    command: ["nginx", "-g", "daemon off;"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    networks: [edge, backend]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    image: ${HIRUP_TEST_API_IMAGE:-hirup-api-test:local-t7-3}
    environment:
      HIRUP_DATA_DIR: /data
      OTP_URL: http://otp:8080/otp/gtfs/v1
      OSRM_CAR_URL: http://osrm-car:5000
      OSRM_MOTO_URL: http://osrm-moto:5000
    volumes: ["${HIRUP_LOCAL_DATA:?set existing local graphs}:/data:ro"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8003:8000"]
    networks: [backend, routing]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 90s
  api-preview:
    image: ${HIRUP_PREVIEW_API_IMAGE:-hirup-api:local-t7-3}
    profiles: [preview]
    environment:
      HIRUP_DEMO: "false"
      HIRUP_DATA_DIR: /data
      HIRUP_TRUNK_PENALTY: "2"
      OTP_URL: http://otp:8080/otp/gtfs/v1
      OSRM_CAR_URL: http://osrm-car:5000
      OSRM_MOTO_URL: http://osrm-moto:5000
    volumes: ["${HIRUP_LOCAL_DATA:?set existing local graphs}:/data:ro"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8004:8000"]
    networks: [routing]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 90s
networks:
  public: {}
  edge: {internal: true}
  backend: {internal: true}
  routing:
    external: true
    name: ${HIRUP_CI_PROJECT:?set isolated routing project}_default
volumes:
  certificates: {}
  caddy-config: {}
