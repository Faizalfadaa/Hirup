name: hirup-prod
services:
  caddy:
    image: ${CADDY_IMAGE:?set pinned Caddy image}
    environment:
      HIRUP_DOMAIN: ${HIRUP_DOMAIN:?set API domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    networks: [public, edge]
    depends_on:
      gateway: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://gateway:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  gateway:
    image: ${NGINX_IMAGE:?set pinned Nginx image}
    command: ["nginx", "-g", "daemon off;"]
    entrypoint: []
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    networks: [edge, backend]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  api:
    image: ${HIRUP_API_IMAGE:?set immutable API release image}
    environment:
      HIRUP_DEMO: "false"
      HIRUP_DATA_DIR: /data
      HIRUP_AQ_MANIFESTS: ${HIRUP_AQ_MANIFESTS:-[]}
      HIRUP_AQ_INPUTS: ${HIRUP_AQ_INPUTS:-}
      HIRUP_AQ_HISTORY: ${HIRUP_AQ_HISTORY:-}
      HIRUP_CITY_MEDIANS: ${HIRUP_CITY_MEDIANS:-}
      HIRUP_TRUNK_PENALTY: ${HIRUP_TRUNK_PENALTY:?provide agreed routing factor}
      OTP_URL: http://otp:8080/otp/gtfs/v1
      OSRM_CAR_URL: http://osrm-car:5000
      OSRM_MOTO_URL: http://osrm-moto:5000
    volumes: ["${HIRUP_DATA_HOST:?set data path}:/data:ro"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, routing]
    depends_on:
      otp: {condition: service_healthy}
      osrm-car: {condition: service_healthy}
      osrm-moto: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
  otp:
    image: ${OTP_IMAGE:?set pinned OTP image}
    command: ["--load", "--serve"]
    environment: {JAVA_TOOL_OPTIONS: -Xmx8g, TZ: Asia/Jakarta}
    volumes:
      - ${HIRUP_DATA_HOST:?set data path}/otp:/var/opentripplanner:ro
      - ../scripts/health.sh:/health.sh:ro
    networks: [routing]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/bash", "/health.sh", "otp"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s
  osrm-car:
    image: ${OSRM_IMAGE:?set pinned OSRM image}
    command: ["osrm-routed", "--algorithm", "MLD", "--verbosity", "WARNING", "--max-alternatives", "3", "/data/pilot.osrm"]
    volumes:
      - ${HIRUP_DATA_HOST:?set data path}/osrm/car:/data:ro
      - ../scripts/health.sh:/health.sh:ro
    networks: [routing]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/bash", "/health.sh", "osrm"]
      interval: 20s
      timeout: 5s
      retries: 5
  osrm-moto:
    image: ${OSRM_IMAGE:?set pinned OSRM image}
    command: ["osrm-routed", "--algorithm", "MLD", "--verbosity", "WARNING", "--max-alternatives", "3", "/data/pilot.osrm"]
    volumes:
      - ${HIRUP_DATA_HOST:?set data path}/osrm/motorcycle:/data:ro
      - ../scripts/health.sh:/health.sh:ro
    networks: [routing]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/bash", "/health.sh", "osrm"]
      interval: 20s
      timeout: 5s
      retries: 5
networks:
  public: {}
  edge: {internal: true}
  backend: {internal: true}
  routing: {internal: true}
volumes:
  certificates: {}
  caddy-config: {}
