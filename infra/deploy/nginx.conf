worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 512; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    # Caddy replaces this header and is the only peer on the edge network.
    limit_req_zone $http_x_hirup_client_ip zone=plans:1m rate=10r/m;
    limit_req_zone $http_x_hirup_client_ip zone=advice:1m rate=3r/m;
    server {
        listen 8080;
        server_tokens off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        error_page 429 = @limited;
        error_page 400 413 414 431 = @invalid;
        error_page 502 504 = @unavailable;
        location = /v1/routes/plan {
            limit_req zone=plans burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://api:8000;
        }
        location = /v1/routes/departure-advice {
            limit_req zone=advice burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://api:8000;
        }
        location / {
            # AQ/health contracts do not declare 429; do not expand them here.
            proxy_pass http://api:8000;
        }
        location @limited {
            default_type application/problem+json;
            add_header Retry-After 60 always;
            return 429 '{"type":"rate_limited","title":"Too many requests","status":429,"detail":"Request rate exceeds the route budget","request_id":"$request_id"}';
        }
        location @invalid {
            default_type application/problem+json;
            return 400 '{"type":"validation_error","title":"Invalid request","status":400,"request_id":"$request_id"}';
        }
        location @unavailable {
            default_type application/problem+json;
            return 503 '{"type":"data_unavailable","title":"Service temporarily unavailable","status":503,"request_id":"$request_id"}';
        }
    }
}
